<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>728棋牌 - H5客户端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: #fff; min-height:100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* 登录页 */
.login-box { max-width: 400px; margin: 100px auto; background: rgba(255,255,255,0.05); border-radius: 16px; padding: 40px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
.login-box h1 { text-align:center; margin-bottom:30px; font-size:28px; background: linear-gradient(90deg, #ffd700, #ff8c00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.login-box input { width:100%; padding:14px 16px; margin-bottom:16px; border:1px solid rgba(255,255,255,0.2); border-radius:8px; background:rgba(255,255,255,0.05); color:#fff; font-size:15px; outline:none; transition:border .3s; }
.login-box input:focus { border-color:#ffd700; }
.login-box button { width:100%; padding:14px; border:none; border-radius:8px; background:linear-gradient(90deg, #ffd700, #ff8c00); color:#1a1a2e; font-size:16px; font-weight:bold; cursor:pointer; transition:transform .2s; }
.login-box button:hover { transform:scale(1.02); }
.login-box .tip { text-align:center; margin-top:16px; font-size:13px; color:rgba(255,255,255,0.5); }
.login-box .error { color:#ff4444; text-align:center; margin-bottom:12px; font-size:14px; min-height:20px; }

/* 顶部栏 */
.topbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:rgba(0,0,0,0.3); border-radius:12px; margin-bottom:24px; }
.topbar .user-info { display:flex; align-items:center; gap:16px; }
.topbar .avatar { width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg, #ffd700, #ff8c00); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; color:#1a1a2e; }
.topbar .gold { display:flex; align-items:center; gap:8px; background:rgba(255,215,0,0.1); padding:8px 16px; border-radius:20px; border:1px solid rgba(255,215,0,0.3); }
.topbar .gold .coin { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg, #ffd700, #daa520); display:flex; align-items:center; justify-content:center; font-size:12px; color:#8b4513; font-weight:bold; }
.topbar .gold span { font-size:18px; font-weight:bold; color:#ffd700; }
.topbar .actions { display:flex; gap:10px; }
.topbar .actions button { padding:8px 16px; border:1px solid rgba(255,255,255,0.2); border-radius:8px; background:rgba(255,255,255,0.05); color:#fff; cursor:pointer; font-size:14px; transition:all .2s; }
.topbar .actions button:hover { background:rgba(255,255,255,0.1); }
.topbar .ws-status { display:flex; align-items:center; gap:6px; font-size:13px; }
.topbar .ws-dot { width:8px; height:8px; border-radius:50%; background:#666; }
.topbar .ws-dot.online { background:#00ff88; box-shadow:0 0 8px #00ff88; }

/* 大厅标题 */
.hall-title { text-align:center; margin-bottom:24px; }
.hall-title h2 { font-size:32px; margin-bottom:8px; }
.hall-title p { color:rgba(255,255,255,0.6); font-size:14px; }

/* 游戏分类标签 */
.game-tabs { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.game-tabs .tab { padding:8px 20px; border-radius:20px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); cursor:pointer; font-size:14px; transition:all .2s; }
.game-tabs .tab.active { background:linear-gradient(90deg, #ffd700, #ff8c00); color:#1a1a2e; border-color:transparent; font-weight:bold; }

/* 游戏网格 */
.game-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:16px; }
.game-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:20px; text-align:center; cursor:pointer; transition:all .3s; position:relative; overflow:hidden; }
.game-card:hover { transform:translateY(-4px); border-color:rgba(255,215,0,0.5); box-shadow:0 8px 24px rgba(255,215,0,0.15); }
.game-card .icon { font-size:40px; margin-bottom:12px; }
.game-card .name { font-size:16px; font-weight:bold; margin-bottom:4px; }
.game-card .code { font-size:12px; color:rgba(255,255,255,0.4); }
.game-card .tag { position:absolute; top:8px; right:8px; font-size:10px; padding:2px 8px; border-radius:10px; }
.game-card .tag.hot { background:rgba(255,68,68,0.2); color:#ff4444; }
.game-card .tag.new { background:rgba(0,255,136,0.2); color:#00ff88; }
.game-card.disabled { opacity:0.4; cursor:not-allowed; }
.game-card.disabled:hover { transform:none; border-color:rgba(255,255,255,0.1); box-shadow:none; }

/* 游戏页面 */
.game-page { display:none; }
.game-page.active { display:block; }
.game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.game-header button { padding:10px 20px; border:1px solid rgba(255,255,255,0.2); border-radius:8px; background:rgba(255,255,255,0.05); color:#fff; cursor:pointer; }
.game-header h2 { font-size:24px; }

/* 百家乐桌面 */
.baccarat-table { background:linear-gradient(135deg, #1a5c3a, #0d3d24); border-radius:16px; padding:40px; text-align:center; min-height:400px; position:relative; border:3px solid #c9a96e; }
.baccarat-table .title { font-size:24px; color:#ffd700; margin-bottom:30px; font-weight:bold; }
.baccarat-areas { display:flex; justify-content:center; gap:60px; margin-bottom:30px; }
.baccarat-area { text-align:center; }
.baccarat-area .label { font-size:18px; margin-bottom:12px; color:#fff; }
.baccarat-area .cards { display:flex; gap:-10px; justify-content:center; min-height:100px; }
.card { width:60px; height:84px; background:#fff; border-radius:6px; display:flex; flex-direction:column; justify-content:space-between; padding:6px; color:#000; font-weight:bold; box-shadow:0 2px 8px rgba(0,0,0,0.3); margin:0 -8px; }
.card.red { color:#d40000; }
.card .top { font-size:14px; text-align:left; }
.card .center { font-size:24px; text-align:center; }
.card .bottom { font-size:14px; text-align:right; transform:rotate(180deg); }
.card.back { background:linear-gradient(135deg, #2c3e50, #1a252f); }
.baccarat-score { font-size:32px; color:#ffd700; margin-top:12px; font-weight:bold; }
.baccarat-bet-area { display:flex; justify-content:center; gap:20px; margin-top:20px; }
.bet-btn { padding:12px 24px; border-radius:8px; border:2px solid; cursor:pointer; font-size:15px; font-weight:bold; transition:all .2s; }
.bet-btn.player { border-color:#3498db; color:#3498db; background:rgba(52,152,219,0.1); }
.bet-btn.banker { border-color:#e74c3c; color:#e74c3c; background:rgba(231,76,60,0.1); }
.bet-btn.tie { border-color:#f1c40f; color:#f1c40f; background:rgba(241,196,15,0.1); }
.bet-btn:hover { transform:scale(1.05); }
.bet-btn.selected { background:rgba(255,255,255,0.2); }

/* 龙虎斗桌面 */
.dragon-tiger-table { background:linear-gradient(135deg, #8b0000, #4a0000); border-radius:16px; padding:40px; text-align:center; min-height:400px; border:3px solid #ffd700; }
.dragon-tiger-table .title { font-size:24px; color:#ffd700; margin-bottom:30px; }
.dt-areas { display:flex; justify-content:center; gap:80px; }
.dt-area { text-align:center; }
.dt-area .label { font-size:20px; margin-bottom:16px; }
.dt-area.dragon .label { color:#ff6b6b; }
.dt-area.tiger .label { color:#ffd93d; }
.dt-area .cards { min-height:100px; display:flex; justify-content:center; }

/* 奔驰宝马桌面 */
.bcbm-table { background:linear-gradient(135deg, #2c1810, #1a0f08); border-radius:16px; padding:40px; text-align:center; min-height:400px; border:3px solid #c9a96e; }
.bcbm-table .title { font-size:24px; color:#ffd700; margin-bottom:30px; }
.bcbm-wheel { width:200px; height:200px; border-radius:50%; border:8px solid #c9a96e; margin:0 auto 20px; background:conic-gradient(#e74c3c 0deg 45deg, #3498db 45deg 90deg, #2ecc71 90deg 135deg, #f1c40f 135deg 180deg, #9b59b6 180deg 225deg, #e67e22 225deg 270deg, #1abc9c 270deg 315deg, #e84393 315deg 360deg); position:relative; transition:transform 3s ease-out; }
.bcbm-wheel::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:40px; height:40px; border-radius:50%; background:#c9a96e; }
.bcbm-pointer { position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:20px solid #ffd700; }
.bcbm-result { font-size:20px; color:#ffd700; margin-top:16px; min-height:30px; }

/* 游戏控制栏 */
.game-controls { display:flex; justify-content:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
.game-controls button { padding:10px 24px; border-radius:8px; border:none; cursor:pointer; font-size:14px; font-weight:bold; transition:all .2s; }
.game-controls .btn-primary { background:linear-gradient(90deg, #ffd700, #ff8c00); color:#1a1a2e; }
.game-controls .btn-secondary { background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); }
.game-controls button:hover { transform:scale(1.05); }
.game-controls button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* 状态面板 */
.status-panel { background:rgba(0,0,0,0.3); border-radius:12px; padding:16px; margin-top:20px; font-size:13px; }
.status-panel .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.status-panel .row:last-child { border-bottom:none; }
.status-panel .label { color:rgba(255,255,255,0.5); }
.status-panel .value { color:#ffd700; font-family:monospace; }

/* 消息日志 */
.msg-log { background:rgba(0,0,0,0.4); border-radius:8px; padding:12px; margin-top:16px; max-height:200px; overflow-y:auto; font-size:12px; font-family:monospace; }
.msg-log .msg { padding:2px 0; color:rgba(255,255,255,0.6); }
.msg-log .msg.send { color:#87ceeb; }
.msg-log .msg.recv { color:#98fb98; }
.msg-log .msg.error { color:#ff6b6b; }

/* 下注弹窗 */
.bet-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.bet-modal.active { display:flex; }
.bet-box { background:#1a1a2e; border-radius:16px; padding:30px; max-width:360px; width:90%; border:1px solid rgba(255,215,0,0.3); }
.bet-box h3 { text-align:center; margin-bottom:20px; color:#ffd700; }
.bet-amounts { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:20px; }
.bet-amount { padding:14px; border-radius:8px; border:2px solid rgba(255,255,255,0.2); text-align:center; cursor:pointer; font-weight:bold; transition:all .2s; }
.bet-amount:hover { border-color:#ffd700; }
.bet-amount.selected { border-color:#ffd700; background:rgba(255,215,0,0.1); color:#ffd700; }
.bet-box .actions { display:flex; gap:10px; }
.bet-box .actions button { flex:1; padding:12px; border-radius:8px; border:none; cursor:pointer; font-weight:bold; }
.bet-box .actions .confirm { background:linear-gradient(90deg, #ffd700, #ff8c00); color:#1a1a2e; }
.bet-box .actions .cancel { background:rgba(255,255,255,0.1); color:#fff; }

.hidden { display:none !important; }
</style>
</head>
<body>
<div class="container">

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-box">
    <h1>728棋牌</h1>
    <div class="error" id="loginError"></div>
    <input type="text" id="loginAccount" placeholder="账号 (test001)" value="test001">
    <input type="password" id="loginPassword" placeholder="密码 (123456)" value="123456">
    <button onclick="doLogin()">登 录</button>
    <div class="tip">服务端: localhost:8000 / WS: localhost:10000</div>
  </div>
</div>

<!-- 大厅页 -->
<div id="hallPage" class="hidden">
  <div class="topbar">
    <div class="user-info">
      <div class="avatar" id="userAvatar">T</div>
      <div>
        <div style="font-weight:bold;font-size:16px;" id="userName">test001</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.5);" id="userId">ID: 1</div>
      </div>
      <div class="gold">
        <div class="coin">¥</div>
        <span id="userGold">0</span>
      </div>
    </div>
    <div class="actions">
      <div class="ws-status"><div class="ws-dot" id="wsDot"></div><span id="wsText">未连接</span></div>
      <button onclick="showMsgLog()">消息日志</button>
      <button onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="hall-title">
    <h2>游戏大厅</h2>
    <p>21款游戏 · 实时对战 · 金币模式</p>
  </div>

  <div class="game-tabs" id="gameTabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="mahjong">麻将</div>
    <div class="tab" data-cat="niuniu">牛牛</div>
    <div class="tab" data-cat="poker">扑克</div>
    <div class="tab" data-cat="arcade">电玩</div>
  </div>

  <div class="game-grid" id="gameGrid"></div>

  <div class="msg-log hidden" id="msgLog"></div>
</div>

<!-- 游戏页 -->
<div id="gamePage" class="game-page">
  <div class="game-header">
    <button onclick="backToHall()">← 返回大厅</button>
    <h2 id="gameTitle">游戏</h2>
    <div style="width:100px;"></div>
  </div>
  <div id="gameContent"></div>
  <div class="game-controls" id="gameControls"></div>
  <div class="status-panel" id="statusPanel"></div>
</div>

<!-- 下注弹窗 -->
<div class="bet-modal" id="betModal">
  <div class="bet-box">
    <h3 id="betTitle">选择下注金额</h3>
    <div class="bet-amounts" id="betAmounts"></div>
    <div class="actions">
      <button class="cancel" onclick="closeBetModal()">取消</button>
      <button class="confirm" onclick="confirmBet()">确认下注</button>
    </div>
  </div>
</div>

</div>

<script>
// ==================== 配置 ====================
const CONFIG = {
  httpServer: 'http://localhost:8000/',
  wsServer: 'ws://localhost:10000',
};

// 游戏列表 (与服务端21款对齐, 含客户端数字ID映射)
const GAMES = [
  { id:1, code:'FQZS', name:'飞禽走兽', cat:'arcade', icon:'🦅', tag:'hot' },
  { id:2, code:'BRNN', name:'百人牛牛', cat:'niuniu', icon:'🐂', tag:'hot' },
  { id:3, code:'HBSL', name:'红包扫雷', cat:'arcade', icon:'🧧' },
  { id:6, code:'LHD', name:'龙虎斗', cat:'poker', icon:'🐉', tag:'hot' },
  { id:7, code:'BCBM', name:'奔驰宝马', cat:'arcade', icon:'🚗', tag:'hot' },
  { id:8, code:'BJL', name:'百家乐', cat:'poker', icon:'🎴', tag:'hot' },
  { id:9, code:'SDB', name:'三公', cat:'poker', icon:'🃏' },
  { id:13, code:'DNTG', name:'大闹天宫', cat:'arcade', icon:'🎰' },
  { id:14, code:'QZNN', name:'抢庄牛牛', cat:'niuniu', icon:'🐂' },
  { id:15, code:'ERNN', name:'二人牛牛', cat:'niuniu', icon:'🐂' },
  { id:16, code:'HLWZ', name:'红中五子', cat:'mahjong', icon:'🀄' },
  { id:17, code:'ERQS', name:'二人抢庄', cat:'mahjong', icon:'🀄' },
  { id:18, code:'TBNN', name:'通比牛牛', cat:'niuniu', icon:'🐂' },
  { id:19, code:'DZPK', name:'德州扑克', cat:'poker', icon:'♠️', tag:'new' },
  { id:20, code:'ZJH', name:'炸金花', cat:'poker', icon:'💎' },
  { id:21, code:'SRNN', name:'四人牛牛', cat:'niuniu', icon:'🐂' },
  { id:22, code:'JXLW', name:'九线拉王', cat:'arcade', icon:'🎰' },
  { id:23, code:'SHZ', name:'三张牌', cat:'poker', icon:'🃏' },
  { id:26, code:'DFDC', name:'多福多财', cat:'arcade', icon:'💰' },
  { id:28, code:'WZMJ', name:'温州麻将', cat:'mahjong', icon:'🀄', tag:'hot' },
  { id:1000, code:'MJHJ', name:'麻将合集', cat:'mahjong', icon:'🀄' },
];

// 可演示的游戏 (有完整UI)
const DEMO_GAMES = ['BJL', 'LHD', 'BCBM'];

// ==================== 状态 ====================
let state = {
  token: null,
  uid: null,
  user: null,
  ws: null,
  wsConnected: false,
  currentGame: null,
  currentRoomId: null,
  gameState: null,
  msgLog: [],
  betTarget: null,
  betAmount: 0,
};

// ==================== 工具 ====================
function b64encode(obj) { return btoa(JSON.stringify(obj)); }
function b64decode(str) { return JSON.parse(atob(str)); }
function $(id) { return document.getElementById(id); }
function fmtGold(n) { return Number(n||0).toLocaleString(); }

function addMsgLog(type, event, data) {
  const msg = `[${type}] ${event}: ${JSON.stringify(data).substring(0,100)}`;
  state.msgLog.push(msg);
  if (state.msgLog.length > 100) state.msgLog.shift();
  const el = $('msgLog');
  if (el && !el.classList.contains('hidden')) {
    el.innerHTML = state.msgLog.map(m => `<div class="msg ${type.toLowerCase()}">${m}</div>`).join('');
    el.scrollTop = el.scrollHeight;
  }
}

function showMsgLog() {
  const el = $('msgLog');
  el.classList.toggle('hidden');
  if (!el.classList.contains('hidden')) {
    el.innerHTML = state.msgLog.map(m => `<div class="msg">${m}</div>`).join('');
  }
}

// ==================== HTTP登录 ====================
async function doLogin() {
  const account = $('loginAccount').value.trim();
  const password = $('loginPassword').value;
  $('loginError').textContent = '';

  if (!account || !password) {
    $('loginError').textContent = '请输入账号和密码';
    return;
  }

  try {
    const body = `data=${encodeURIComponent(JSON.stringify({ uid: account, password, equipmentcard: 'h5-client', type: 1, code: -1 }))}`;
    const res = await fetch(CONFIG.httpServer + 'Login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    const json = await res.json();
    if (json.code !== 20000) {
      $('loginError').textContent = json.message || '登录失败';
      return;
    }
    state.token = json.data.token;
    state.uid = json.data.uid || json.data.id;
    state.user = json.data;
    enterHall();
  } catch (e) {
    $('loginError').textContent = '网络错误: ' + e.message;
  }
}

function doLogout() {
  if (state.ws) { state.ws.close(); state.ws = null; }
  state = { token:null, uid:null, user:null, ws:null, wsConnected:false, currentGame:null, currentRoomId:null, gameState:null, msgLog:[], betTarget:null, betAmount:0 };
  $('loginPage').classList.remove('hidden');
  $('hallPage').classList.add('hidden');
  $('gamePage').classList.remove('active');
}

// ==================== 大厅 ====================
function enterHall() {
  $('loginPage').classList.add('hidden');
  $('hallPage').classList.remove('hidden');

  const u = state.user;
  $('userName').textContent = u.nickname || u.account || '玩家';
  $('userId').textContent = 'ID: ' + (state.uid || u.id);
  $('userGold').textContent = fmtGold(u.gold);
  $('userAvatar').textContent = (u.nickname || u.account || 'P')[0].toUpperCase();

  renderGameGrid('all');
  connectWS();
}

function renderGameGrid(cat) {
  const games = cat === 'all' ? GAMES : GAMES.filter(g => g.cat === cat);
  $('gameGrid').innerHTML = games.map(g => {
    const demo = DEMO_GAMES.includes(g.code) ? '' : 'disabled';
    const tag = g.tag ? `<div class="tag ${g.tag}">${g.tag === 'hot' ? '热门' : '新'}</div>` : '';
    return `<div class="game-card ${demo}" onclick="enterGame(${g.id})" title="${demo ? '演示版暂未开放' : '点击进入'}">
      ${tag}
      <div class="icon">${g.icon}</div>
      <div class="name">${g.name}</div>
      <div class="code">${g.code}</div>
    </div>`;
  }).join('');
}

// 分类标签切换
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    renderGameGrid(e.target.dataset.cat);
  }
});

// ==================== WebSocket ====================
function connectWS() {
  if (state.ws) { state.ws.close(); }
  state.ws = new WebSocket(CONFIG.wsServer);

  state.ws.onopen = () => {
    state.wsConnected = true;
    updateWsStatus(true);
    // 认证
    wsSend('Msg_Hall_Connect', { token: state.token });
    // 心跳
    state.heartbeat = setInterval(() => {
      if (state.wsConnected) wsSend('Msg_Hall_Heart', []);
    }, 5000);
  };

  state.ws.onmessage = (event) => {
    try {
      const msg = b64decode(event.data);
      addMsgLog('RECV', msg.event, msg.data);
      handleWsMessage(msg);
    } catch (e) {
      console.error('WS decode error:', e);
    }
  };

  state.ws.onclose = () => {
    state.wsConnected = false;
    updateWsStatus(false);
    if (state.heartbeat) clearInterval(state.heartbeat);
  };

  state.ws.onerror = (e) => {
    console.error('WS error:', e);
    addMsgLog('ERROR', 'WS', e.type || 'error');
  };
}

function updateWsStatus(online) {
  $('wsDot').className = 'ws-dot ' + (online ? 'online' : '');
  $('wsText').textContent = online ? '已连接' : '未连接';
}

function wsSend(event, data) {
  if (!state.ws || !state.wsConnected) {
    addMsgLog('ERROR', event, 'WS未连接');
    return false;
  }
  const payload = b64encode({ event, area: 0, uid: state.uid, data });
  state.ws.send(payload);
  addMsgLog('SEND', event, data);
  return true;
}

function handleWsMessage(msg) {
  const { event, data } = msg;

  // 大厅消息
  if (event === 'Msg_Hall_Connect') {
    if (data?.gold !== undefined) {
      $('userGold').textContent = fmtGold(data.gold);
    }
  }
  if (event === 'Msg_Hall_Heart') { /* 心跳响应 */ }

  // 游戏消息 (适配后的 Msg_{GAME}_{Action})
  if (state.currentGame && event.startsWith('Msg_' + state.currentGame.code + '_')) {
    handleGameMessage(event, data);
  }

  // 通用游戏消息 (Msg_Game_*)
  if (event.startsWith('Msg_Game_')) {
    handleGameMessage(event, data);
  }

  // 错误
  if (event === 'Msg_Hall_ERROR') {
    console.warn('Server error:', data?.message);
  }
}

// ==================== 游戏入口 ====================
function enterGame(gameId) {
  const game = GAMES.find(g => g.id === gameId);
  if (!game) return;
  if (!DEMO_GAMES.includes(game.code)) {
    alert(`${game.name} 演示版暂未开放，当前可体验: ${DEMO_GAMES.map(c => GAMES.find(g=>g.code===c)?.name).join('、')}`);
    return;
  }

  state.currentGame = game;
  // roomId = gameId * 1e7 + 1 (与客户端计算方式一致)
  state.currentRoomId = gameId * 10000000 + 1;
  state.gameState = null;

  $('hallPage').classList.add('hidden');
  $('gamePage').classList.add('active');
  $('gameTitle').textContent = `${game.icon} ${game.name}`;

  renderGameUI();
  // 获取游戏状态 (使用客户端通用协议 Msg_Game_GetState + gtype)
  wsSend('Msg_Game_GetState', { gtype: gameId, roomId: state.currentRoomId });
}

function backToHall() {
  state.currentGame = null;
  state.currentRoomId = null;
  state.gameState = null;
  $('gamePage').classList.remove('active');
  $('hallPage').classList.remove('hidden');
}

// ==================== 游戏UI渲染 ====================
function renderGameUI() {
  const game = state.currentGame;
  const content = $('gameContent');
  const controls = $('gameControls');

  if (game.code === 'BJL') {
    content.innerHTML = renderBaccarat();
    controls.innerHTML = `
      <button class="btn-primary" onclick="gameAction('Start')">开始游戏</button>
      <button class="btn-secondary" onclick="gameAction('GetState')">刷新状态</button>
    `;
  } else if (game.code === 'LHD') {
    content.innerHTML = renderDragonTiger();
    controls.innerHTML = `
      <button class="btn-primary" onclick="gameAction('Start')">开始游戏</button>
      <button class="btn-secondary" onclick="gameAction('GetState')">刷新状态</button>
    `;
  } else if (game.code === 'BCBM') {
    content.innerHTML = renderBCBM();
    controls.innerHTML = `
      <button class="btn-primary" onclick="gameAction('Start')">开始游戏</button>
      <button class="btn-secondary" onclick="gameAction('GetState')">刷新状态</button>
    `;
  }

  updateStatusPanel();
}

function renderBaccarat() {
  const s = state.gameState || {};
  const playerCards = s.playerCards || [];
  const bankerCards = s.bankerCards || [];
  return `<div class="baccarat-table">
    <div class="title">百家乐 · Baccarat</div>
    <div class="baccarat-areas">
      <div class="baccarat-area">
        <div class="label">闲家 (Player)</div>
        <div class="cards">${playerCards.map(c => renderCard(c)).join('') || '<div class="card back"></div>'}</div>
        <div class="baccarat-score">${s.playerScore ?? '-'}</div>
      </div>
      <div class="baccarat-area">
        <div class="label">庄家 (Banker)</div>
        <div class="cards">${bankerCards.map(c => renderCard(c)).join('') || '<div class="card back"></div>'}</div>
        <div class="baccarat-score">${s.bankerScore ?? '-'}</div>
      </div>
    </div>
    <div style="color:#ffd700;font-size:18px;margin-top:10px;">${s.winner ? '获胜: ' + (s.winner === 'player' ? '闲家' : s.winner === 'banker' ? '庄家' : '和局') : '等待发牌...'}</div>
    <div class="baccarat-bet-area">
      <div class="bet-btn player" onclick="openBet('player')">闲 1:1</div>
      <div class="bet-btn tie" onclick="openBet('tie')">和 1:8</div>
      <div class="bet-btn banker" onclick="openBet('banker')">庄 1:0.95</div>
    </div>
  </div>`;
}

function renderDragonTiger() {
  const s = state.gameState || {};
  return `<div class="dragon-tiger-table">
    <div class="title">龙虎斗 · Dragon Tiger</div>
    <div class="dt-areas">
      <div class="dt-area dragon">
        <div class="label">🐉 龙</div>
        <div class="cards">${s.dragonCard ? renderCard(s.dragonCard) : '<div class="card back"></div>'}</div>
      </div>
      <div class="dt-area tiger">
        <div class="label">🐯 虎</div>
        <div class="cards">${s.tigerCard ? renderCard(s.tigerCard) : '<div class="card back"></div>'}</div>
      </div>
    </div>
    <div style="color:#ffd700;font-size:20px;margin-top:30px;">${s.winner ? '获胜: ' + (s.winner === 'dragon' ? '龙' : s.winner === 'tiger' ? '虎' : '和') : '等待发牌...'}</div>
    <div class="baccarat-bet-area" style="margin-top:20px;">
      <div class="bet-btn" style="border-color:#ff6b6b;color:#ff6b6b;" onclick="openBet('dragon')">龙 1:1</div>
      <div class="bet-btn tie" onclick="openBet('tie')">和 1:8</div>
      <div class="bet-btn" style="border-color:#ffd93d;color:#ffd93d;" onclick="openBet('tiger')">虎 1:1</div>
    </div>
  </div>`;
}

function renderBCBM() {
  const s = state.gameState || {};
  const rotation = s.rotation || 0;
  return `<div class="bcbm-table">
    <div class="title">奔驰宝马 · Big Car BMW</div>
    <div style="position:relative;width:200px;margin:0 auto;">
      <div class="bcbm-pointer"></div>
      <div class="bcbm-wheel" id="bcbmWheel" style="transform:rotate(${rotation}deg)"></div>
    </div>
    <div class="bcbm-result">${s.result ? '结果: ' + s.result : '等待开奖...'}</div>
    <div class="baccarat-bet-area" style="margin-top:20px;">
      <div class="bet-btn" style="border-color:#e74c3c;color:#e74c3c;" onclick="openBet('mercedes')">奔驰</div>
      <div class="bet-btn" style="border-color:#3498db;color:#3498db;" onclick="openBet('bmw')">宝马</div>
      <div class="bet-btn" style="border-color:#2ecc71;color:#2ecc71;" onclick="openBet('audi')">奥迪</div>
      <div class="bet-btn" style="border-color:#f1c40f;color:#f1c40f;" onclick="openBet('大众')">大众</div>
    </div>
  </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const suits = { '♠':'♠','♥':'♥','♦':'♦','♣':'♣' };
  const values = {1:'A',11:'J',12:'Q',13:'K'};
  const suit = card.suit || card.s || '♠';
  const val = values[card.value || card.v] || (card.value || card.v || '?');
  const red = (suit === '♥' || suit === '♦') ? 'red' : '';
  return `<div class="card ${red}">
    <div class="top">${val}${suit}</div>
    <div class="center">${suit}</div>
    <div class="bottom">${val}${suit}</div>
  </div>`;
}

function updateStatusPanel() {
  const s = state.gameState || {};
  const g = state.currentGame;
  $('statusPanel').innerHTML = `
    <div class="row"><span class="label">游戏</span><span class="value">${g?.name || '-'} (${g?.code || '-'})</span></div>
    <div class="row"><span class="label">房间ID</span><span class="value">${state.currentRoomId || '-'}</span></div>
    <div class="row"><span class="label">游戏阶段</span><span class="value">${s.phase || s.status || '等待中'}</span></div>
    <div class="row"><span class="label">当前轮次</span><span class="value">${s.round || s.currentRound || '-'}</span></div>
    <div class="row"><span class="label">在线玩家</span><span class="value">${s.players?.length || s.playerCount || 0}</span></div>
  `;
}

// ==================== 游戏动作 ====================
function gameAction(action) {
  if (!state.currentGame) return;
  const gtype = state.currentGame.id;
  const roomId = state.currentRoomId;
  wsSend('Msg_Game_' + action, { gtype, roomId, seat: 0 });
}

function handleGameMessage(event, data) {
  if (data?.state) {
    state.gameState = data.state;
  } else if (data) {
    state.gameState = { ...state.gameState, ...data };
  }
  renderGameUI();
}

// ==================== 下注 ====================
function openBet(target) {
  state.betTarget = target;
  state.betAmount = 0;
  $('betTitle').textContent = `下注到: ${target === 'player' ? '闲家' : target === 'banker' ? '庄家' : target === 'dragon' ? '龙' : target === 'tiger' ? '虎' : target === 'tie' ? '和局' : target}`;
  const amounts = [10, 50, 100, 500, 1000, 5000];
  $('betAmounts').innerHTML = amounts.map(a =>
    `<div class="bet-amount" onclick="selectBet(${a})">${a}</div>`
  ).join('');
  $('betModal').classList.add('active');
}

function selectBet(amount) {
  state.betAmount = amount;
  document.querySelectorAll('.bet-amount').forEach(el => el.classList.remove('selected'));
  event.target.classList.add('selected');
}

function closeBetModal() {
  $('betModal').classList.remove('active');
}

function confirmBet() {
  if (!state.betAmount) { alert('请选择下注金额'); return; }
  // 发送下注消息 (电玩/扑克类通用 Bet 动作)
  wsSend('Msg_Game_Bet', {
    gtype: state.currentGame.id,
    roomId: state.currentRoomId,
    target: state.betTarget,
    amount: state.betAmount,
    seat: 0,
  });
  closeBetModal();
}

// ==================== 启动 ====================
console.log('728 H5 Client loaded. Server:', CONFIG.httpServer, 'WS:', CONFIG.wsServer);
</script>
</body>
</html>
