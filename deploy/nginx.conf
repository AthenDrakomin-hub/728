# ============================================================
# 728棋牌平台 Nginx 反向代理配置
# 放置: /etc/nginx/conf.d/728.conf
# ============================================================

# HTTP服务反向代理
upstream 728_http {
    server 127.0.0.1:8000;
    keepalive 32;
}

# WebSocket服务反向代理
upstream 728_ws {
    server 127.0.0.1:10000;
    keepalive 32;
}

server {
    listen 80;
    server_name web.lexiangim.com h5.lexiangim.com im.lexiangim.com;

    # 前端静态文件
    root /opt/728/web-ui;
    index index.html;

    # gzip压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # API接口反向代理
    location /api/ {
        proxy_pass http://728_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 原协议HTTP接口
    location ~ ^/(Login|Register|terrace)/ {
        proxy_pass http://728_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # WebSocket代理
    location /ws {
        proxy_pass http://728_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查
    location /health {
        proxy_pass http://728_http/health;
    }

    # 禁止访问敏感文件
    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    # 日志
    access_log /var/log/nginx/728_access.log;
    error_log /var/log/nginx/728_error.log;
}

